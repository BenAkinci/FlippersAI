name: Validate frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Lite JavaScript
        run: node --check lite.js
      - name: Build Lite prototype
        run: npm run build
      - name: Verify Lite build output
        run: test -f public/index.html && test -f public/lite.js && test -f public/lite.css && test -f public/brand-app-icon.svg

name: Validate frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check community.js
      - run: node --check platform.js
      - run: node --check ux-fixes.js
      - run: node --check workflow-browser.js
      - run: node --check scout-web.js
      - run: node --check scout-smart-web.js
      - run: npm run check:extension
      - name: Parse Chrome workspace modules
        run: |
          node --input-type=module - <<'NODE'
          for (const file of ['extension/app.js','extension/scout-session.js','extension/scout-smart-overview.js','extension/single-scan-polish.js']) {
            try {
              await import(`file://${process.cwd()}/${file}?verify=${Date.now()}`)
            } catch (error) {
              if (error instanceof SyntaxError) {
                console.error(file, error)
                process.exit(1)
              }
              console.log(`${file} parsed successfully; expected browser-runtime stop: ${error.name}`)
            }
          }
          NODE
      - run: npm run build
      - run: test -f public/index.html && test -f public/app.js && test -f public/styles.css && test -f public/community.js && test -f public/community.css && test -f public/platform.js && test -f public/platform.css && test -f public/ux-fixes.js && test -f public/ux-fixes.css && test -f public/brand.css && test -f public/brand-logo.svg && test -f public/brand-app-icon.svg && test -f public/brand-icon-180.png && test -f public/brand-icon-192.png && test -f public/site.webmanifest && test -f public/workflow-browser.js && test -f public/workflow-browser.css && test -f public/scout-web.js && test -f public/scout-web.css && test -f public/scout-smart-web.js && test -f public/scout-smart-web.css
      - run: test -f extension/manifest.json && test -f extension/sidepanel.html && test -f extension/workspace.html && test -f extension/service-worker.js && test -f extension/content.js && test -f extension/scout-collection-content.js && test -f extension/api.js && test -f extension/app.js && test -f extension/styles.css && test -f extension/brand.css && test -f extension/brand-logo.svg && test -f extension/brand-app-icon.svg && test -f extension/floating-window.js && test -f extension/scout-session.js && test -f extension/scout-session.css && test -f extension/scout-smart-overview.js && test -f extension/scout-smart-overview.css && test -f extension/single-scan-polish.js && test -f extension/single-scan-polish.css && test -f extension/icons/icon16.png && test -f extension/icons/icon32.png && test -f extension/icons/icon48.png && test -f extension/icons/icon128.png
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: flippersai-chrome-extension
          path: flippersai-extension.zip
          if-no-files-found: error

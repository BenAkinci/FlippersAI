name: Repair extension source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-extension-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair inventory template expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('extension/app.js')
          text = p.read_text()
          old = "Record a purchase from a Deal File and it appears here automatically.</div>`)\n  $('#inventoryWebsite')"
          new = "Record a purchase from a Deal File and it appears here automatically.</div>`}`)\n  $('#inventoryWebsite')"
          if old in text:
              p.write_text(text.replace(old, new, 1))
              print('repaired')
          else:
              print('already repaired or pattern changed')
          PY
      - name: Verify extension parses
        run: |
          node --input-type=module - <<'NODE'
          try {
            await import(`file://${process.cwd()}/extension/app.js?verify=${Date.now()}`)
          } catch (error) {
            if (error instanceof SyntaxError) {
              console.error(error)
              process.exit(1)
            }
            console.log(`Extension parsed successfully; expected browser-runtime stop: ${error.name}`)
          }
          NODE
      - name: Commit source repair
        run: |
          if git diff --quiet; then
            echo "No source repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/app.js
          git commit -m "Fix Chrome extension inventory template syntax"
          git push origin HEAD:main
